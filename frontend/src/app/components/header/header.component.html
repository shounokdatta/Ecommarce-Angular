<nav class="navbar">
  <!-- LEFT -->
  <div class="nav-left">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPgSfUAo_uWMMQ11mIb8QeLYEfdanxWWmZ0g&s"
         class="logo" (click)="navigate()" />
    <span class="site-name">GreenCart</span>
  </div>

  <!-- CENTER -->
  <div class="nav-center" *ngIf="!isLoginPage && !isSginupPage">
    <input [(ngModel)]="searchValue" class="search-bar" placeholder="Search..." />
    <button class="search-btn" (click)="onSearch()">
      <i class="fas fa-search"></i>
    </button>
  </div>

  <!-- RIGHT -->
  <div class="nav-right" *ngIf="!isLoginPage && !isSginupPage">

    <!-- 3 DOT -->
    <button class="icon-button" (click)="toggleDropdown()">
      <i class="fas fa-ellipsis-v"></i>
    </button>

    <!-- DROPDOWN -->
    <div class="dropdown-menu" *ngIf="isDropdownOpen">
      <button>Order History</button>
      <button (click)="sellerButtonClick()">Become a Seller</button>
      <button>About Us</button>
      <button (click)="logout()">Logout</button>
    </div>

    <!-- PROFILE -->
    <img src="https://www.pngmart.com/files/23/Profile-PNG-Photo.png"
         class="profile" (click)="profileBtnClick()" />

    <!-- CART -->
<button class="icon-button cart-btn" (click)="toggleCart($event)">
  <i class="fas fa-shopping-cart"></i>
  <span class="cart-count">{{ cartItemCount }}</span>
</button>

    <!-- CART ITEMS -->
<div class="cart-container"
     *ngIf="isCartOpen"
     (click)="$event.stopPropagation()">
      <div *ngFor="let item of cartItems" class="item-card">
        <img [src]="item.image" class="item-img">

        <div class="item-details">
          <h4>{{ item.name }}</h4>
          <p>₹{{ item.price }}</p>

          <div class="qty">
            <button (click)="decreaseQuantity(item)">-</button>
            <span>{{ item.quantity }}</span>
            <button (click)="increaseQuantity(item)">+</button>
          </div>

          <button (click)="removeItem(item.id)">Delete</button>
        </div>
      </div>

      <div class="cart-total">
        Total: ₹{{ total }}
      </div>
    </div>

  </div>
</nav>
